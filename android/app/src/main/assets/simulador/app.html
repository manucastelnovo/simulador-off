        <script>
        (function(){
            if (location.protocol !== 'file:') return;
            var origFetch = window.fetch;
            window.fetch = function(input, init) {
                var url = typeof input === 'string' ? input : (input && input.url);
                if (!url || !/^(file:|[^:]*$|\.{1,2}\/|\/)/i.test(url)) {
                    return origFetch ? origFetch.apply(this, arguments) : Promise.reject(new TypeError('no fetch'));
                }
                return new Promise(function(resolve, reject){
                    try {
                        var xhr = new XMLHttpRequest();
                        xhr.open((init && init.method) || 'GET', url, true);
                        if (init && init.headers) {
                            for (var h in init.headers) { try { xhr.setRequestHeader(h, init.headers[h]); } catch(_){} }
                        }
                        xhr.responseType = 'text';
                        xhr.onload = function(){
                            var status = xhr.status === 0 && xhr.responseText ? 200 : xhr.status;
                            var body = xhr.responseText;
                            resolve({
                                ok: status >= 200 && status < 300,
                                status: status,
                                statusText: xhr.statusText || '',
                                url: url,
                                text: function(){ return Promise.resolve(body); },
                                json: function(){ try { return Promise.resolve(JSON.parse(body)); } catch(e){ return Promise.reject(e); } },
                                blob: function(){ return Promise.resolve(new Blob([body])); },
                            });
                        };
                        xhr.onerror = function(){ reject(new TypeError('Failed to fetch (xhr shim): ' + url)); };
                        xhr.send((init && init.body) || null);
                    } catch (e) { reject(e); }
                });
            };
        })();
        </script>

        <style>html,body{visibility:hidden}html.flavor-ready,html.flavor-ready body{visibility:visible}</style>
        <script>
        (function(){
            function reveal(){ document.documentElement.classList.add('flavor-ready'); }
            function watchBody(){
                if (!document.body) return;
                if (document.body.classList.length > 0) { reveal(); return; }
                var obs = new MutationObserver(function(){
                    if (document.body.classList.length > 0) { reveal(); obs.disconnect(); }
                });
                obs.observe(document.body, { attributes: true, attributeFilter: ['class'] });
            }
            if (document.body) watchBody();
            else document.addEventListener('DOMContentLoaded', watchBody);
            setTimeout(reveal, 4000);
        })();
        </script>
