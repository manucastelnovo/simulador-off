        (function(){
            function reveal(){ document.documentElement.classList.add('flavor-ready'); }
            function watchBody(){
                if (!document.body) return;
                if (document.body.classList.length > 0) { reveal(); return; }
                var obs = new MutationObserver(function(){
                    if (document.body.classList.length > 0) { reveal(); obs.disconnect(); }
                });
                obs.observe(document.body, { attributes: true, attributeFilter: ['class'] });
            }
            if (document.body) watchBody();
            else document.addEventListener('DOMContentLoaded', watchBody);
            setTimeout(reveal, 1000);
        })();
